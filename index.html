<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTC Salary Calculator Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-content">
            <div>
                <h1>💰 CTC Salary Calculator Pro</h1>
                <p>Complete salary analysis with tax, comparison & recommendations</p>
            </div>
            <div class="action-buttons">
                <button class="btn" onclick="saveComparison()">💾 Save for Comparison</button>
                <button class="btn" onclick="window.print()">📄 Export PDF</button>
                <button class="btn btn-primary" onclick="showRecommendations()">💡 Smart Tips</button>
            </div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab(event,'calculator')">🧮 Calculator</div>
        <div class="tab" onclick="switchTab(event,'tax')">📊 Tax Analysis</div>
        <div class="tab" onclick="switchTab(event,'comparison')">⚖️ Compare Offers</div>
        <div class="tab" onclick="switchTab(event,'city')">🏙️ City Comparison</div>
    </div>

    <!-- Calculator -->
    <div class="tab-content active" id="calculator-tab">
        <div class="content">
            <div class="input-section">
                <h2>📝 Input Details</h2>

                <div class="input-group">
                    <label>Currency</label>
                    <select id="currency" onchange="updateCurrency()">
                        <option value="INR">INR</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Offer Name</label>
                    <input type="text" id="offer-name" placeholder="Company / Role">
                </div>

                <div class="input-group">
                    <label>Annual CTC</label>
                    <input type="number" id="ctc">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Basic %</label>
                        <input type="number" id="basic-percent" value="40">
                    </div>
                    <div class="input-group">
                        <label>HRA % of Basic</label>
                        <input type="number" id="hra-percent" value="50">
                    </div>
                </div>

                <button class="calculate-btn" onclick="calculateSalary()">Calculate</button>
            </div>

            <div class="output-section">
                <h2>📊 Salary Breakdown</h2>
                <div id="output-content" class="empty-state">
                    Enter details and calculate
                </div>
            </div>
        </div>
    </div>

    <!-- Tax -->
    <div class="tab-content" id="tax-tab">
        <div class="input-section">
            <h2>📊 Income Tax</h2>
            <button class="calculate-btn" onclick="calculateTax()">Calculate Tax</button>
            <div id="tax-output"></div>
        </div>
    </div>

    <!-- Comparison -->
    <div class="tab-content" id="comparison-tab">
        <div id="comparison-content" class="comparison-grid"></div>
    </div>

    <!-- City -->
    <div class="tab-content" id="city-tab">
        <button class="calculate-btn" onclick="compareCities()">Compare Cities</button>
        <div id="city-output"></div>
    </div>
</div>

<!-- Modal -->
<div id="recommendations-modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2>💡 Recommendations</h2>
        <div id="recommendations-content"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
